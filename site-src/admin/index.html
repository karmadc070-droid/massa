<!doctype html>
<!-- massaviet.com/admin — 관리자 전용 지표 화면. 데이터 접근은 DB 함수가 막는다(여기서 숨기는 게 아니다). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>mㅏssㅏ 지표</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Serif+KR:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --sand:#FAF6F0; --sand-deep:#F1E9DE; --ink:#2A2320; --ink-soft:#6B5F57;
  --line:#E9E1D6; --amber:#B0742F; --amber-lo:#F6EDE1; --clay:#8C5A3C;
  --white:#fff; --good:#2E7D5B; --bad:#B2506A; --cool:#4A6D7C;
  --serif:'Cormorant Garamond','Noto Serif KR',Georgia,serif;
  --sans:'Inter',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --r:16px;
  --shadow:0 1px 2px rgba(42,35,32,.04), 0 8px 24px -12px rgba(42,35,32,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;font-variant-numeric:lining-nums;margin:0}
h1,h2,h3,p,td,th,li{word-break:keep-all;overflow-wrap:break-word}
button{font-family:inherit;font-size:13.5px;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ── 골격: 좌측 내비 + 본문 ── */
.shell{display:flex;min-height:100vh}
nav.side{width:224px;flex:none;background:var(--ink);color:#EFE7DC;padding:22px 16px;
         position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.side .logo{font-family:var(--serif);font-size:25px;color:#fff;padding:0 10px 4px}
nav.side .tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#B0742F;
              padding:0 10px 22px}
nav.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
           font-size:13.5px;color:#C9BEB1}
nav.side a:hover{background:rgba(255,255,255,.06);color:#fff}
nav.side a.on{background:var(--amber);color:#fff}
nav.side .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
nav.side .foot{margin-top:auto;font-size:11.5px;color:#8A7E71;padding:0 10px;line-height:1.5}

main{flex:1;min-width:0;padding:0 clamp(16px,2.6vw,34px) 60px}
.top{position:sticky;top:0;z-index:9;background:var(--sand);padding:20px 0 14px;
     display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{font-size:27px}
.top .sub{font-size:12.5px;color:var(--ink-soft);width:100%;margin-top:-4px}
.grow{margin-left:auto}
.tabs{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{background:none;border:0;color:var(--ink-soft);border-radius:999px;padding:7px 15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ghost{background:var(--white);border:1px solid var(--line);color:var(--ink-soft);
       border-radius:10px;padding:8px 14px}

/* ── 오늘 스트립 ── */
.today{background:var(--ink);color:#F3EBE0;border-radius:var(--r);padding:18px 22px;
       display:grid;grid-template-columns:auto repeat(5,1fr);gap:8px 26px;align-items:center;margin-bottom:20px}
.today .lab{font-family:var(--serif);font-size:23px;color:#fff;padding-right:14px;
            border-right:1px solid rgba(255,255,255,.16)}
.today .lab small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;
                  text-transform:uppercase;color:var(--amber)}
.today .it{min-width:0}
.today .it b{display:block;font-family:var(--serif);font-size:29px;font-weight:400;line-height:1.1;
             font-variant-numeric:lining-nums}
.today .it span{font-size:11.5px;color:#B3A79A}
.today .it.alert b{color:#F0B36B}

/* ── 카드 ── */
.grid{display:grid;gap:16px;margin-bottom:20px}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.55fr 1fr}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);
      padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-family:var(--sans);font-weight:600;letter-spacing:-.01em}
.card .note{font-size:12px;color:var(--ink-soft);margin:2px 0 12px}
.kpi .lab{font-size:12.5px;color:var(--ink-soft)}
.kpi .val{font-family:var(--serif);font-size:37px;line-height:1.1;margin:5px 0 2px;
          font-variant-numeric:lining-nums}
.kpi .val.amber{color:var(--amber)}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;
       padding:3px 8px;border-radius:999px;background:var(--sand-deep);color:var(--ink-soft)}
.delta.up{background:#E4F1EA;color:var(--good)}
.delta.dn{background:#F7E5EA;color:var(--bad)}
.kpi .foot{font-size:11.5px;color:var(--ink-soft);margin-top:6px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ── 도넛 ── */
.ring{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring .mid{position:relative;width:168px;flex:none}
.ring .mid .ctr{position:absolute;inset:0;display:flex;flex-direction:column;
                align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:lining-nums}
.ring .ctr span{font-size:11.5px;color:var(--ink-soft)}
.brk{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.brk .r{display:flex;align-items:center;gap:9px;font-size:13px}
.brk .r i{width:9px;height:9px;border-radius:2px;flex:none}
.brk .r b{margin-left:auto;font-variant-numeric:tabular-nums}
.brk .r em{font-style:normal;color:var(--ink-soft);font-size:11.5px;width:44px;text-align:right}

/* ── 마사지사 ── */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.p{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);
   border-radius:13px;background:var(--sand)}
.p .av{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--sand-deep)}
.p .nm{font-weight:600;font-size:13.5px}
.p .mt{font-size:11.5px;color:var(--ink-soft)}
.p .rk{margin-left:auto;font-family:var(--serif);font-size:22px;color:var(--amber);flex:none}
.empty{color:var(--ink-soft);font-size:13.5px;padding:26px 4px;text-align:center}
.find{padding:9px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;
      background:var(--sand);min-width:200px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-align:right;
        padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:right;
        font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl th:first-child,.tbl td:first-child,.tbl th.l,.tbl td.l{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--sand)}
.who{display:flex;align-items:center;gap:9px}
.who img,.who .ph{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;background:var(--sand-deep)}
.owe{color:var(--bad);font-weight:600}
.owe.zero{color:var(--ink-soft);font-weight:400}
.cred{color:var(--good);font-weight:600}
.mini{background:var(--white);border:1px solid var(--line);color:var(--ink);
      border-radius:8px;padding:5px 10px;font-size:12px;white-space:nowrap}
.mini:hover{background:var(--sand-deep)}
.scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
.chip{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;padding:2px 7px;
      border-radius:999px;vertical-align:1px;background:var(--sand-deep);color:var(--ink-soft)}
.chip.t-vip{background:#EBDCC6;color:var(--amber)}
.chip.t-shop{background:#DDE7EB;color:var(--cool)}

/* ── 로그인 ── */
.gate{max-width:372px;margin:9vh auto;background:var(--white);border:1px solid var(--line);
      border-radius:18px;padding:32px 30px;box-shadow:var(--shadow)}
.gate h1{font-size:29px;margin-bottom:5px}
.gate p{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
            font:inherit;margin-bottom:9px;background:var(--sand)}
.gate .btn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px;margin-top:6px}
.gate .btn.google{background:var(--white);color:var(--ink);border:1px solid var(--line);margin-top:0}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-soft);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{display:block;width:100%;background:none;border:0;color:var(--ink-soft);
         font-size:13px;text-decoration:underline;padding:9px 0 0}
.err{color:var(--bad);font-size:13px;min-height:19px;margin-top:8px}
.ok{color:var(--good)}

@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr)} .g23{grid-template-columns:1fr} }
@media(max-width:820px){
  .shell{display:block}
  nav.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;
           padding:12px 14px;gap:6px;align-items:center}
  nav.side .tag,nav.side .foot{display:none}
  nav.side .logo{font-size:20px;padding:0 8px 0 2px}
  nav.side a{padding:8px 12px;white-space:nowrap}
  main{padding:0 16px 50px}
  .today{grid-template-columns:repeat(2,1fr);gap:14px}
  .today .lab{grid-column:1/-1;border-right:0;border-bottom:1px solid rgba(255,255,255,.16);padding:0 0 10px}
  .today .it b{font-size:25px}
}
@media(max-width:560px){ .g4{grid-template-columns:1fr} }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h1>지표</h1>
  <p>관리자 계정으로 로그인해 주세요.</p>
  <button class="btn google" id="goog">Google 계정으로 로그인</button>
  <div class="or"><span>또는 비밀번호로</span></div>
  <input id="em" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn" id="go">로그인</button>
  <div class="err" id="gerr"></div>
  <button class="linkbtn" id="reset">비밀번호를 잊으셨나요</button>
</div>

<div class="shell" id="app" hidden>
  <nav class="side">
    <div class="logo">mㅏssㅏ</div>
    <div class="tag">지표</div>
    <a href="#s-today" class="on"><i class="dot"></i>오늘</a>
    <a href="#s-kpi"><i class="dot"></i>요약</a>
    <a href="#s-money"><i class="dot"></i>수익</a>
    <a href="#s-match"><i class="dot"></i>매칭</a>
    <a href="#s-traffic"><i class="dot"></i>유입</a>
    <a href="#s-people"><i class="dot"></i>인기 순위</a>
    <a href="#s-roster"><i class="dot"></i>마사지사 명단</a>
    <div class="foot">
      <div id="who"></div>
      <button class="linkbtn" id="out" style="text-align:left;padding-top:8px">로그아웃</button>
    </div>
  </nav>

  <main>
    <div class="top">
      <h1>지표</h1>
      <div class="tabs" id="tabs">
        <button data-b="day"   data-n="14" aria-pressed="true">일간</button>
        <button data-b="week"  data-n="12">주간</button>
        <button data-b="month" data-n="12">월간</button>
        <button data-b="year"  data-n="5">연간</button>
      </div>
      <span class="grow"></span>
      <button class="ghost" id="rf">새로고침</button>
      <div class="sub" id="range"></div>
    </div>

    <section id="s-today"><div class="today" id="today"></div></section>
    <section id="s-kpi"><div class="grid g4" id="kpi"></div></section>

    <div class="grid g23">
      <div class="card" id="s-money">
        <h3>수익</h3>
        <p class="note" id="money-note"></p>
        <div id="c-money"></div>
      </div>
      <div class="card" id="s-match">
        <h3>예약은 어떻게 끝났나</h3>
        <p class="note">이 기간에 들어온 예약의 최종 상태입니다.</p>
        <div id="c-ring"></div>
      </div>
    </div>

    <div class="card" id="s-traffic" style="margin-bottom:20px">
      <h3>유입</h3>
      <p class="note">앱을 연 기기 수입니다. 같은 기기가 하루에 여러 번 열어도 한 번으로 셉니다.</p>
      <div id="c-traffic"></div>
    </div>

    <div class="card" id="s-people" style="margin-bottom:20px">
      <h3>인기 마사지사</h3>
      <p class="note">이 기간에 들어온 예약이 많은 순입니다.</p>
      <div id="people"></div>
    </div>

    <div class="card" id="s-roster">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <h3>마사지사 명단</h3>
          <p class="note" id="roster-note"></p>
        </div>
        <input id="q" placeholder="이름·지역·코드로 찾기" class="find">
      </div>
      <div id="roster"></div>
    </div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(
  'https://api.moahagwon.com',
  'eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogInN1cGFiYXNlIiwgImlhdCI6IDE3ODc0NTg4OTMsICJleHAiOiAyMTAyODE4ODkzfQ.7taJaAzxPRIkd0PeC5qnuacficFnazkBN54ttblUv-o',
  // pkce 를 강제한다. 암시적 흐름이면 주소창 해시에 access_token 이 그대로 붙어
  // 주소를 복사해 남에게 보내는 순간 관리자 세션이 새어 나간다. 실제로 한 번 겪었다.
  { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true } });

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('ko-KR');
const vnd = (n) => Number(n || 0).toLocaleString('ko-KR') + '₫';
const short = (n) => { n = Number(n || 0);
  return n >= 1e9 ? (n/1e9).toFixed(1)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
       : n >= 1e3 ? Math.round(n/1e3)+'K' : String(n); };
const rate = (a, b) => b ? (Math.round(a / b * 1000) / 10) + '%' : '—';

const C = { amber:'#B0742F', clay:'#8C5A3C', sand:'#E0C9A6', ink:'#2A2320',
            cool:'#4A6D7C', good:'#2E7D5B', bad:'#B2506A', mute:'#C7BCAF' };

const TIER_KO = { vip:'우대', shop:'가게', freelancer:'프리랜서' };
const tierChip = (t, tiers) => t
  ? `<span class="chip t-${esc(t)}">${esc(TIER_KO[t] || t)} ${tiers && tiers[t] != null ? Math.round(tiers[t]*100)+'%' : ''}</span>`
  : '';

let STATE = { bucket:'day', periods:14 }, LAST = null;

const badge = (d, unit) => {
  if (Math.abs(d) < 0.05) return '<span class="delta">변화 없음</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}${unit}</span>`;
};
// 직전 기간 대비 증감. 이전이 0이면 비율을 낼 수 없으니 말로 쓴다.
function delta(now, prev) {
  now = Number(now||0); prev = Number(prev||0);
  if (!prev) return now ? '<span class="delta up">신규</span>' : '<span class="delta">변화 없음</span>';
  return badge((now - prev) / prev * 100, '%');
}
// 비율끼리는 나누면 안 된다. 81.1% 에서 81.3% 로 간 건 "0.2%p 상승"이지 "0.2% 상승"이 아니다.
function deltaPoint(now, prev) {
  if (prev == null || !isFinite(prev)) return '<span class="delta">비교 없음</span>';
  return badge((Number(now) - Number(prev)) * 100, '%p');
}

// ── 그리기 도구. 라이브러리 없이 SVG 로 직접 그린다 ──
const narrow = () => innerWidth < 780;

function spark(vals, color) {
  const W = 120, H = 30, max = Math.max(1, ...vals), n = vals.length;
  if (n < 2) return '';
  const pts = vals.map((v, i) => [i * W / (n - 1), H - (v / max) * (H - 3) - 1.5]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:120px">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;
}

function axis(W, H, PT, PB, max, fmt) {
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const y = PT + (H - PT - PB) * (1 - i / 3);
    g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#E9E1D6" stroke-width="1"/>`
       + `<text x="0" y="${y - 5}" font-size="10.5" fill="#6B5F57">${esc(fmt(Math.round(max * i / 3)))}</text>`;
  }
  return g;
}

function ticks(rows, W, H, gw, PL) {
  const step = Math.ceil(rows.length / (narrow() ? 5 : 12));
  return rows.map((r, i) => (i % step === 0 || i === rows.length - 1)
    ? `<text x="${PL + gw * (i + .5)}" y="${H - 7}" font-size="10" fill="#6B5F57"
         text-anchor="middle">${esc(r.k.length > 7 ? r.k.slice(5) : r.k)}</text>` : '').join('');
}

// 영역 차트 — 수익처럼 "쌓여 가는" 값에 맞는 형태
function area(rows, series, fmt) {
  const W = narrow() ? 460 : 900, H = narrow() ? 250 : 230, PL = 6, PB = 24, PT = 14;
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => Number(r[s.key] || 0))));
  const n = rows.length, gw = (W - PL * 2) / Math.max(n, 1);
  const x = i => PL + gw * (i + .5), y = v => PT + (H - PT - PB) * (1 - v / max);
  let g = axis(W, H, PT, PB, max, fmt);
  series.forEach((s, si) => {
    const pts = rows.map((r, i) => [x(i), y(Number(r[s.key] || 0))]);
    const line = pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
    if (s.fill) g += `<path d="M ${x(0).toFixed(1)} ${H - PB} L ${line} L ${x(n-1).toFixed(1)} ${H - PB} Z"
        fill="url(#gr${si})" />`;
    g += `<path d="M ${line}" fill="none" stroke="${s.color}" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>`;
    g += pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${n > 20 ? 0 : 2.6}"
        fill="#fff" stroke="${s.color}" stroke-width="1.8"><title>${esc(rows[i].k)} · ${esc(s.name)} ${esc(fmt(rows[i][s.key]))}</title></circle>`).join('');
  });
  const defs = series.map((s, si) => s.fill
    ? `<linearGradient id="gr${si}" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0%" stop-color="${s.color}" stop-opacity=".26"/>
         <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs>${defs}</defs>${g}${ticks(rows, W, H, gw, PL)}</svg>`
       + legend(series);
}

function bars(rows, series, fmt) {
  const W = narrow() ? 460 : 900, H = narrow() ? 250 : 220, PL = 6, PB = 24, PT = 14;
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => Number(r[s.key] || 0))));
  const n = rows.length, gw = (W - PL * 2) / Math.max(n, 1);
  const bw = Math.max(2, Math.min(22, gw / (series.length + 0.7)));
  let g = axis(W, H, PT, PB, max, fmt);
  rows.forEach((r, i) => {
    const cx = PL + gw * (i + .5);
    series.forEach((s, j) => {
      const v = Number(r[s.key] || 0), h = (H - PT - PB) * (v / max);
      const xx = cx - (bw * series.length) / 2 + bw * j;
      g += `<rect x="${xx.toFixed(1)}" y="${(H - PB - h).toFixed(1)}" width="${(bw - 1.6).toFixed(1)}"
        height="${Math.max(v > 0 ? 2 : 0, h).toFixed(1)}" fill="${s.color}" rx="2">
        <title>${esc(r.k)} · ${esc(s.name)} ${esc(fmt(v))}</title></rect>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${ticks(rows, W, H, gw, PL)}</svg>` + legend(series);
}

const legend = (series) => '<div class="legend">' + series.map(s =>
  `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('') + '</div>';

// 도넛 — 예약이 어떻게 끝났는지
function donut(parts, total, midTop, midBot) {
  const R = 62, SW = 20, CIRC = 2 * Math.PI * R;
  let off = 0, segs = '';
  const sum = parts.reduce((a, p) => a + p.v, 0);
  parts.forEach(p => {
    if (!p.v) return;
    const len = CIRC * (p.v / (sum || 1));
    segs += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${p.c}" stroke-width="${SW}"
      stroke-dasharray="${(len - 2).toFixed(2)} ${(CIRC - len + 2).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" stroke-linecap="butt"
      transform="rotate(-90 80 80)"><title>${esc(p.n)} ${p.v}건</title></circle>`;
    off += len;
  });
  if (!sum) segs = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="#EDE4D8" stroke-width="${SW}"/>`;
  const rows = parts.map(p => `<div class="r"><i style="background:${p.c}"></i>${esc(p.n)}
      <b>${num(p.v)}</b><em>${sum ? (Math.round(p.v / sum * 1000) / 10) + '%' : '—'}</em></div>`).join('');
  return `<div class="ring">
    <div class="mid"><svg viewBox="0 0 160 160">${segs}</svg>
      <div class="ctr"><b>${esc(midTop)}</b><span>${esc(midBot)}</span></div></div>
    <div class="brk">${rows}</div></div>`;
}

// ── 화면 채우기 ──
function render(d) {
  const S = d.series || [], s = d.sum || {}, p = d.prev || {}, t = d.today || {}, now = d.now || {};
  // 등급이 섞이면 "거래액 × 요율" 은 틀린다. DB 가 예약별 요율로 더해 준 값을 쓴다.
  const rev = Number(s.fee || 0), prevRev = Number(p.fee || 0);
  const tiers = d.fee_tiers || {};
  const tierTxt = ['vip','shop','freelancer'].filter(k => tiers[k] != null)
    .map(k => Math.round(tiers[k] * 100) + '%').join(' · ') || '등급별';
  const label = { day:'최근 14일', week:'최근 12주', month:'최근 12개월', year:'최근 5년' }[d.bucket];

  $('range').textContent =
    `${label} · ${d.from} 부터 · 직전 같은 길이(${d.prev_from} 부터)와 비교 · 하노이 시간 기준`;

  // 오늘
  $('today').innerHTML =
    `<div class="lab"><small>Today</small>오늘</div>` +
    [['유입', t.visits, '앱을 연 기기'],
     ['가입', t.signups, '새 회원'],
     ['새 예약', t.bookings, '오늘 들어온 요청'],
     ['완료', t.done, '오늘 끝난 시술'],
     ['확인 대기', t.deposit_pending, '입금 확인해야 할 건', (t.deposit_pending || 0) > 0]]
    .map(([l, v, sub, alert]) =>
      `<div class="it${alert ? ' alert' : ''}"><b>${num(v)}</b><span>${esc(l)} · ${esc(sub)}</span></div>`)
    .join('');

  // 요약 카드
  const col = (k) => S.map(r => Number(r[k] || 0));
  $('kpi').innerHTML = [
    { lab:'유입', val:num(s.visits), now:s.visits, prev:p.visits, spark:col('visits'), c:C.amber,
      foot:`신규 기기 ${num(s.newbies)} · 가입 ${num(s.signups)}` },
    { lab:'예약', val:num(s.bookings), now:s.bookings, prev:p.bookings, spark:col('bookings'), c:C.cool,
      foot:`성사 ${num(s.matched)} · 완료 ${num(s.done)}` },
    { lab:'매칭율', val:rate(s.matched, s.bookings), point:true,
      now:s.bookings ? s.matched / s.bookings : 0,
      prev:p.bookings ? p.matched / p.bookings : null, spark:col('matched'), c:C.good, amber:true,
      foot:s.bookings ? `실패 ${num((s.cancelled||0) + (s.no_show||0))}건` : '예약 없음' },
    { lab:'수수료 수익', val:short(rev) + '₫', now:rev, prev:prevRev,
      spark:col('fee'), c:C.amber, amber:true,
      foot:`거래액 ${short(s.gmv)}₫ · 요율 ${tierTxt}` }
  ].map(k => `<div class="card kpi">
      <div class="lab">${esc(k.lab)}</div>
      <div class="row"><div>
        <div class="val${k.amber ? ' amber' : ''}">${esc(k.val)}</div>
        ${k.point ? deltaPoint(k.now, k.prev) : delta(k.now, k.prev)}
      </div>${spark(k.spark, k.c)}</div>
      <div class="foot">${esc(k.foot)}</div></div>`).join('');

  // 수익 — 수수료는 거래액의 정확히 같은 비율이라 선을 하나 더 그으면 모양이 겹칠 뿐이다.
  // 그래서 그래프는 거래액 하나만 그리고, 수수료는 숫자로 적는다.
  $('money-note').innerHTML =
    `완료된 예약의 거래액입니다. 이 기간 거래액 <b>${esc(vnd(s.gmv))}</b> 중 `
    + `수수료 <b style="color:var(--amber)">${esc(vnd(rev))}</b>. `
    + `요율은 마사지사 등급에 따라 ${esc(tierTxt)} 이고, 예약이 들어온 시점의 요율로 계산됩니다.`;
  $('c-money').innerHTML = area(S,
    [{ key:'gmv', name:'거래액', color:C.amber, fill:true }], short);

  // 매칭 도넛
  const waiting = s.waiting || 0, canc = s.cancelled || 0, ns = s.no_show || 0;
  const settled = (s.matched || 0) - waiting;
  $('c-ring').innerHTML = donut(
    [{ n:'성사', v:Math.max(settled, 0), c:C.good },
     { n:'대기 중', v:waiting, c:C.sand },
     { n:'취소', v:canc, c:C.bad },
     { n:'노쇼', v:ns, c:C.clay }],
    s.bookings, rate(s.matched, s.bookings), '매칭율');

  // 유입
  $('c-traffic').innerHTML = bars(S,
    [{ key:'visits', name:'방문 기기', color:C.amber },
     { key:'newbies', name:'신규 기기', color:C.sand },
     { key:'signups', name:'가입', color:C.clay }], num);

  // 마사지사
  const tp = d.top || [];
  $('people').innerHTML = tp.length
    ? `<div class="people">${tp.map((x, i) => `<div class="p">
        ${x.photo_url ? `<img class="av" src="${esc(x.photo_url)}" alt="" loading="lazy">`
                      : '<div class="av"></div>'}
        <div style="min-width:0">
          <div class="nm">${esc(x.name || '(이름 없음)')}${tierChip(x.tier, tiers)}</div>
          <div class="mt">예약 ${num(x.bookings)} · 완료 ${num(x.done)}
            ${x.rating != null ? ' · ★' + Number(x.rating).toFixed(1) : ''}
            ${x.district ? ' · ' + esc(x.district) : ''}</div>
          <div class="mt">${vnd(x.gmv)} · 수수료 ${vnd(x.fee)}</div>
        </div><div class="rk">${i + 1}</div></div>`).join('')}</div>`
    : '<div class="empty">이 기간에 들어온 예약이 없습니다.</div>';

  const mix = now.tier_mix || {};
  $('who').innerHTML =
    `회원 ${num(now.members)}명<br>마사지사 ${num(now.providers_total)}명 `
    + `(활동 ${num(now.providers_active)} · 심사 대기 ${num(now.providers_pending)})<br>`
    + `수수료 ${TIER_KO.vip} ${num(mix.vip)} · ${TIER_KO.shop} ${num(mix.shop)} · ${TIER_KO.freelancer} ${num(mix.freelancer)}`;
}

async function loadData() {
  $('range').textContent = '불러오는 중…';
  const { data, error } = await sb.rpc('admin_dashboard',
    { p_bucket: STATE.bucket, p_periods: STATE.periods });
  if (error) { $('range').textContent = '불러오지 못했습니다 — ' + error.message; return; }
  LAST = data; render(data);
}

// 명단은 기간과 무관하다. 한 번 받아 두고 바뀔 때만 다시 받는다.
let ROSTER = null;
async function loadRoster() {
  const box = $('roster'); box.innerHTML = '<div class="empty">불러오는 중…</div>';
  const { data, error } = await sb.rpc('admin_provider_list');
  if (error) { box.innerHTML = '<div class="empty">불러오지 못했습니다 — ' + esc(error.message) + '</div>'; return; }
  ROSTER = data; drawRoster();
}

function drawRoster() {
  if (!ROSTER) return;
  const tiers = ROSTER.tiers || {};
  const q = ($('q').value || '').trim().toLowerCase();
  const all = ROSTER.rows || [];
  const rows = q ? all.filter(r => [r.name, r.district, r.deposit_code]
    .some(v => String(v || '').toLowerCase().includes(q))) : all;

  const oweSum = all.reduce((a, r) => a + Number(r.owe || 0), 0);
  const credSum = all.reduce((a, r) => a + Number(r.credit || 0), 0);
  $('roster-note').innerHTML =
    `가입한 마사지사 <b>${num(all.length)}명</b> · 받아야 할 수수료 <b class="owe">${esc(vnd(oweSum))}</b>`
    + ` · 선입금 잔액 합계 <b class="cred">${esc(vnd(credSum))}</b>`
    + `<br>미납은 <b>발생한 수수료 − 확인된 입금 − 선입금 잔액</b> 입니다. 선입금이 남아 있으면 0으로 봅니다.`;

  if (!rows.length) { $('roster').innerHTML = '<div class="empty">해당하는 사람이 없습니다.</div>'; return; }

  $('roster').innerHTML = '<div class="scroll"><table class="tbl"><thead><tr>'
    + ['마사지사','등급','가입','예약','발생 수수료','확인 입금','선입금 잔액','미납','']
        .map((h, i) => `<th class="${i < 3 ? 'l' : ''}">${esc(h)}</th>`).join('')
    + '</tr></thead><tbody>' + rows.map(r => {
      const owe = Number(r.owe || 0), cred = Number(r.credit || 0);
      return `<tr>
        <td class="l"><div class="who">${r.photo_url
            ? `<img src="${esc(r.photo_url)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
          <div><div style="font-weight:600">${esc(r.name || '(이름 없음)')}</div>
            <div style="font-size:11px;color:var(--ink-soft)">
              ${esc(r.district || '-')} · ${esc(r.deposit_code || '코드 없음')}
              ${r.status === 'pending' ? ' · 심사 대기' : ''}
              ${r.pending_cnt ? ` · <b style="color:var(--amber)">확인 대기 ${r.pending_cnt}</b>` : ''}
            </div></div></div></td>
        <td class="l">${tierChip(r.tier, tiers)}${r.suggest_vip
            ? '<div style="font-size:11px;color:var(--amber)">10% 후보</div>' : ''}</td>
        <td class="l" style="font-size:12px;color:var(--ink-soft)">${esc(r.joined || '-')}</td>
        <td>${num(r.cnt)}</td>
        <td>${vnd(r.fee)}</td>
        <td>${vnd(r.paid_fee)}</td>
        <td class="${cred ? 'cred' : ''}">${vnd(cred)}</td>
        <td class="owe${owe ? '' : ' zero'}">${vnd(owe)}</td>
        <td><button class="mini" onclick="prepay('${esc(r.id)}')">페이백 입력</button>
          ${cred ? `<button class="mini" onclick="useCredit('${esc(r.id)}')">잔고 차감</button>` : ''}</td>
      </tr>`;
    }).join('') + '</tbody></table></div>';
}

const findRow = (id) => (ROSTER.rows || []).find(x => x.id === id) || {};

// 통장에서 확인한 선입금을 넣는다. 보너스를 비워 두면 구간에서 자동 계산된다.
window.prepay = async (id) => {
  const r = findRow(id);
  const raw = prompt(`${r.name} 님이 미리 넣은 금액(₫)을 적어 주세요.\n`
    + `보너스는 구간에 따라 자동으로 붙습니다.`, '');
  if (raw == null) return;
  const amt = Number(String(raw).replace(/[^0-9]/g, ''));
  if (!amt) { alert('숫자를 넣어 주세요.'); return; }
  if (!confirm(`${r.name} · ${vnd(amt)} 를 선입금으로 넣습니다.\n통장에서 확인하신 금액이 맞습니까?`)) return;
  const { data, error } = await sb.rpc('admin_add_prepay',
    { p_provider: id, p_amount: amt, p_bonus: null, p_memo: '관리자 직접 입력' });
  if (error) { alert('실패: ' + error.message); return; }
  alert(`넣었습니다.\n입금 ${vnd(data.amount)} + 보너스 ${vnd(data.bonus)}\n잔액 ${vnd(data.balance)}`);
  loadRoster();
};

// 자동으로 깎지 않는다. 관리자가 누를 때만 잔고에서 뺀다.
window.useCredit = async (id) => {
  const r = findRow(id);
  const raw = prompt(`${r.name} 님의 선입금 잔액 ${vnd(r.credit)} 에서 얼마를 뺄까요?\n`
    + `지금 미납은 ${vnd(r.owe)} 입니다.`, String(r.owe || ''));
  if (raw == null) return;
  const amt = Number(String(raw).replace(/[^0-9]/g, ''));
  if (!amt) { alert('숫자를 넣어 주세요.'); return; }
  const { data, error } = await sb.rpc('admin_use_credit',
    { p_provider: id, p_amount: amt, p_memo: '수수료 차감 (관리자)' });
  if (error) { alert('실패: ' + error.message); return; }
  alert(`차감했습니다. 남은 잔액 ${vnd(data.balance)}`);
  loadRoster();
};

let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => LAST && render(LAST), 200); });

// 사이드바가 지금 보고 있는 구역을 따라오게 한다
const links = [...document.querySelectorAll('nav.side a[href^="#"]')];
addEventListener('scroll', () => {
  let cur = links[0];
  for (const a of links) {
    const el = document.getElementById(a.getAttribute('href').slice(1));
    if (el && el.getBoundingClientRect().top <= 140) cur = a;
  }
  links.forEach(a => a.classList.toggle('on', a === cur));
}, { passive: true });

$('tabs').onclick = (e) => {
  const b = e.target.closest('button[data-b]'); if (!b) return;
  [...$('tabs').querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  STATE = { bucket: b.dataset.b, periods: Number(b.dataset.n) };
  loadData();
};
$('q').oninput = drawRoster;
$('rf').onclick = () => { loadData(); loadRoster(); };
$('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };

$('go').onclick = async () => {
  $('gerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword(
    { email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('gerr').textContent = '로그인에 실패했습니다.'; return; }
  start();
};
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };

$('goog').onclick = async () => {
  $('gerr').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google', options: { redirectTo: 'https://massaviet.com/admin/' } });
  if (error) $('gerr').textContent = '구글 로그인을 열지 못했습니다 — ' + error.message;
};

$('reset').onclick = async () => {
  const em = $('em').value.trim();
  $('gerr').textContent = '';
  if (!em) { $('gerr').textContent = '이메일을 먼저 입력해 주세요.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(em,
    { redirectTo: 'https://massa.moahagwon.com/reset.html' });
  $('gerr').innerHTML = error ? '보내지 못했습니다 — ' + esc(error.message)
    : '<span class="ok">재설정 메일을 보냈습니다. 메일함을 확인해 주세요.</span>';
};

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (location.search.includes('code=') || location.hash.includes('access_token'))
    history.replaceState(null, '', location.pathname);
  if (!session) { $('app').hidden = true; $('gate').hidden = false; return; }
  // 권한은 화면이 아니라 DB 가 판단한다. 함수를 한 번 불러 보고 통과하면 연다.
  const { error } = await sb.rpc('admin_dashboard', { p_bucket: 'day', p_periods: 1 });
  if (error) {
    await sb.auth.signOut();
    $('app').hidden = true; $('gate').hidden = false;
    $('gerr').textContent = '이 계정에는 조회 권한이 없습니다.';
    return;
  }
  $('gate').hidden = true; $('app').hidden = false;
  loadData();
  loadRoster();
}
start();
